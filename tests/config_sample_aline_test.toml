# changes referenced from:
# 1. Tagalog Phonology - Llamzon 1966, https://www.jstor.org/stable/30029139
# 2. Tagalog clitics and prosodic phonology - Kaufman 2007, https://bahasawan.com/wp-content/uploads/2020/01/Tagalog-clitics-and-prosodic-phonology-ms.pdf
# 3. Tagalog Reference Grammar - Schachter & Otanes 1972, https://theswissbay.ch/pdf/Books/Linguistics/Mega%20linguistics%20pack/Austronesian/Tagalog%20Reference%20Grammar%20%28Schachter%20%26%20Otanes%29.pdf

# ================================ FEATURES ================================
epsilon = 0.001

[costs]
skip            = -10
substitute      = 35
expand_compress = 45
vowel_consonant = 5

[salience]
syllabic   = 5
place      = 40
manner     = 50
voice      = 5
nasal      = 20
retroflex  = 10
lateral    = 10
aspirated  = 5
long       = 0
high       = 3
back       = 2
round      = 2
phonation  = 10
airstream  = 10
secondary  = 10

# Point of articulation (Schater & Otanes, 1972)
# edited glottal value from 0.1 to 0.75
[values.place]
bilabial        = 1.0
labiodental     = 0.95
linguolabial    = 0.92
dental          = 0.9
alveolar        = 0.85
retroflex       = 0.8
palato_alveolar = 0.75
alveolo_palatal = 0.72
palatal         = 0.7
velar           = 0.6
uvular          = 0.5
pharyngeal      = 0.3
epiglottal      = 0.2
glottal         = 0.75
labiovelar      = 1.0
vowel           = -1.0

# manner of articulation, the way in which air escapes (Schater & Otanes, 1972)
# Added nasal = 0.55, Schachter & Otanes (1972) group Tagalog nasals (/m, n, ŋ/) as sonorant consonants
[values.manner]
stop              = 1.0
affricate         = 0.9
fricative         = 0.85
lateral_fricative = 0.8
trill             = 0.7
tap               = 0.65
lateral_flap      = 0.6
approximant       = 0.6
nasal             = 0.55
high_vowel        = 0.4
mid_vowel         = 0.2
low_vowel         = 0.0
vowel             = 0.5

# tongue height in articulation (Llamzon 1966)
[values.high]
high      = 1.0
near_high = 0.85
high_mid  = 0.65
mid       = 0.5
low_mid   = 0.35
near_low  = 0.15
low       = 0.0

# part of the tongue used (Llamzon 1966)
[values.back]
front      = 1.0
near_front = 0.75
central    = 0.5
near_back  = 0.25
back       = 0.0

[values.binary]
plus  = 1.0
minus = 0.0

# The Ladefoged & Maddieson Continuum
[values.phonation]
modal   = 1.0
breathy = 0.75
creaky  = 0.5
stiff   = 0.25
slack   = 0.0

[values.airstream]
pulmonic  = 1.0
ejective  = 0.66
implosive = 0.33
click     = 0.0

[values.secondary]
none           = 1.0
labialized     = 0.75
palatalized    = 0.5
velarized      = 0.25
pharyngealized = 0.0

# ========================================================================
# ================================ VOWELS ================================

# Vowel: A

# Llamzon (1966) describes 'a' as a low, central, tense, unrounded vowel
# changed back = "front" -> back = "central"
# changed manner = "vowel" -> manner = "low_vowel"
[sounds."a"]
type      = "vowel"
place     = "vowel"
manner    = "low_vowel"
back      = "central"
high      = "low"
lateral   = "minus"
long      = "minus"
nasal     = "minus"
retroflex = "minus"
round     = "minus"
syllabic  = "plus"
voice     = "plus"
phonation = "modal"
airstream = "pulmonic"
secondary = "none"

