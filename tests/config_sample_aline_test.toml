# Vowel: A

# changed back = "back" -> back = "central"
# 
[sounds."A"]
type      = "vowel"
place     = "vowel"
manner    = "vowel"
back      = "back"
high      = "low"
lateral   = "minus"
long      = "plus"
nasal     = "minus"
retroflex = "minus"
round     = "minus"
syllabic  = "plus"
voice     = "plus"
phonation = "modal"
airstream = "pulmonic"
secondary = "none"

# Llamzon (1966) describes 'a' as a low, central, tense, unrounded vowel
# changed back = "front" -> back = "central"
# changed manner = "vowel" -> manner = "low_vowel"
