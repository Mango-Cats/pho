[package]
name = "pho"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow = "58.2.0"
clap = { version = "4.5.24", features = ["derive"] }
csv = "1.4.0"
enum-map = { version = "2.7.3", features = ["serde"]}
include_dir = "0.7.4"
indicatif = "0.17.8"
once_cell = "1.21.4"
parquet = { version = "58.2.0", features = ["arrow"] }
rand = "0.8"
rayon = "1.12.0"
serde = { version = "1.0", features = ["derive"] }
tagabaybay = { git = "https://github.com/Mango-Cats/tagabaybay" }
thiserror = "2.0.18"
toml = "1.1.0"
unicode-segmentation = "1.11.0"
